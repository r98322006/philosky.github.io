</style></head><body><aside><div class="brand">◈ &nbsp;My Workspace<small>Better Planning, Better Life</small></div><nav class="nav" id="nav"><button data-page="home" class="active"><span>⌂</span>首頁</button><button data-page="calendar"><span>▦</span>行事曆</button><button data-page="tasks"><span>◉</span>任務中心</button><button data-page="notes"><span>▤</span>筆記 & 知識庫</button><button type="button" onclick="window.open('./travel.html', '_blank')"><span>✈</span>旅遊規劃</button></nav><div class="sidebottom">Collect moments. Not things.<p>© My Workspace</p></div></aside><main class="shell"><header class="hero"><div><h1>Good morning,<br><b>今天也要做喜歡的事。</b></h1><p>專注當下，讓每一個選擇都更靠近想要的生活。</p></div><div class="date" id="today"></div></header><div class="content"><section id="home" class="page active"><div class="stats"><div class="stat"><div class="symbol">▦</div><div><small>今日行程</small><strong id="s-events">0</strong></div></div><div class="stat"><div class="symbol">✓</div><div><small>待辦任務</small><strong id="s-tasks">0</strong></div></div><div class="stat"><div class="symbol">▤</div><div><small>筆記靈感</small><strong id="s-notes">0</strong></div></div><div class="stat"><div class="symbol">✈</div><div><small>旅遊行程</small><strong id="s-trips">0</strong></div></div></div><div class="dashboard"><div><div class="panel"><div class="panelhead"><h2>▦ &nbsp;行事曆</h2><button class="btn secondary" onclick="go('calendar')">查看全部 →</button></div><div id="miniweek" class="week"></div><div id="minievents" class="timeline"></div></div></div><div><div class="panel"><div class="panelhead"><h2>☑ &nbsp;我的任務中心</h2><button class="btn" onclick="openForm('task')">＋ 新增任務</button></div><div id="tasktabs" class="tabs"><button class="active" data-filter="all">全部</button><button data-filter="today">今日</button><button data-filter="open">待完成</button><button data-filter="done">已完成</button></div><div id="hometasks"></div></div><div class="panel"><div class="panelhead"><h2>▤ &nbsp;快速筆記</h2><button class="btn" onclick="openForm('note')">＋ 新增筆記</button></div><div id="homenotes" class="notes"></div></div></div><div><div class="panel"><div class="panelhead"><h2>✈ &nbsp;旅遊規劃</h2><button class="btn secondary" onclick="window.location.href='travel.html'">查看全部 →</button></div><div id="hometrip"></div></div></div></div></section><section id="calendar" class="page"><div class="panel"><div class="panelhead"><h2>行事曆 · Calendar</h2><button class="btn" onclick="openForm('event')">＋ 新增行程</button></div><div class="widegrid"><div><div class="panelhead"><button class="btn secondary" onclick="changeMonth(-1)">‹</button><h2 id="monthtitle"></h2><button class="btn secondary" onclick="changeMonth(1)">›</button></div><div id="monthgrid" class="week" style="grid-auto-rows:58px"></div></div><div><h3 id="selectedtitle"></h3><div id="fullevents"></div></div></div></div></section><section id="tasks" class="page"><div class="panel"><div class="panelhead"><h2>任務中心 · Tasks</h2><button class="btn" onclick="openForm('task')">＋ 新增任務</button></div><input id="tasksearch" class="search" placeholder="搜尋任務..." oninput="render()"><div id="alltasks"></div></div></section><section id="notes" class="page"><div class="panel"><div class="panelhead"><h2>筆記與知識庫 · Notes</h2><button class="btn" onclick="openForm('note')">＋ 新增筆記</button></div><input id="notesearch" class="search" placeholder="搜尋標題或內容..." oninput="render()"><div id="allnotes" class="notegrid" style="margin-top:15px"></div></div></section><section id="travel" class="page"><div class="panel"><div class="panelhead"><h2>旅遊規劃 · Travel Planner</h2><button class="btn" onclick="openForm('trip')">＋ 建立旅程</button></div><div id="alltrips"></div></div></section></div></main><div id="overlay" class="modalwrap"><div class="modal"><h2 id="formtitle"></h2><div id="formfields"></div><div class="modalactions"><button class="btn secondary" onclick="closeForm()">取消</button><button class="btn" onclick="saveForm()">儲存</button></div></div></div><script>
const key='my-workspace-v1',todayISO=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'}),dayShift=(n)=>{let d=new Date(todayISO()+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};let seed={events:[{id:1,date:todayISO(),time:'09:30',title:'團隊例會',detail:'會議室 A'},{id:2,date:todayISO(),time:'12:30',title:'專案討論',detail:'線上會議'},{id:3,date:todayISO(),time:'15:00',title:'客戶提案簡報',detail:'會議室 B'},{id:4,date:todayISO(),time:'19:00',title:'與朋友晚餐',detail:'大安區'}],tasks:[{id:11,title:'完成本週專案進度報告',date:todayISO(),priority:'高優先',done:false},{id:12,title:'確認跨部門會議資料',date:todayISO(),priority:'一般',done:false},{id:13,title:'整理下週工作規劃',date:dayShift(1),priority:'一般',done:false},{id:14,title:'回覆客戶郵件',date:todayISO(),priority:'一般',done:false},{id:15,title:'預約健身房課程',date:todayISO(),priority:'低優先',done:false}],notes:[{id:21,title:'未來想去的地方',body:'日本北陸（冬季雪景）\n義大利南部\n冰島（極光）',image:'https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=450'},{id:22,title:'工作想法',body:'提升團隊視覺效果\n建立個人品牌內容\nAI 工具導入流程',image:'https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=450'},{id:23,title:'攝影靈感',body:'山景＋火車\n城市夜景\n光影與構圖',image:'https://images.unsplash.com/photo-1473116763249-2faaef81ccda?w=450'}],trips:[{id:31,title:'日本・關西之旅',start:'2026-11-20',end:'2026-11-25',detail:'大阪、京都、嵐山',days:[{title:'Day 1 · 台北 → 大阪',detail:'抵達關西機場、飯店入住、道頓堀'},{title:'Day 2 · 大阪市區',detail:'大阪城、道頓堀、心齋橋購物'},{title:'Day 3 · 京都一日遊',detail:'清水寺、二年坂、嵐山'}]}]};let data;try{data=JSON.parse(localStorage.getItem(key))||seed}catch{data=seed}let selected=todayISO(),month=new Date(selected+'T12:00:00'),filter='all',formType='',editId=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),persist=()=>localStorage.setItem(key,JSON.stringify(data)),dateFmt=s=>new Date(s+'T12:00:00').toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'});$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'long',timeZone:'Asia/Taipei'});function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render();window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('tasktabs').onclick=e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;render()}};function render(){const ev=data.events.filter(x=>x.date===todayISO());$('s-events').textContent=ev.length;$('s-tasks').textContent=data.tasks.filter(x=>!x.done).length;$('s-notes').textContent=data.notes.length;$('s-trips').textContent=data.trips.length;renderCalendar();renderTasks();renderNotes();renderTrips()}
function renderCalendar(){let base=new Date(selected+'T12:00:00'),wd=['日','一','二','三','四','五','六'];$('miniweek').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(base.getDate()-base.getDay()+i);let s=d.toISOString().slice(0,10);return `<button class="day ${s===selected?'selected':''}" onclick="chooseDate('${s}')"><small>${wd[i]}</small>${d.getDate()}</button>`}).join('');let events=data.events.filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));$('minievents').innerHTML=events.length?events.map(x=>`<div class="event" data-time="${esc(x.time)}"><b>${esc(x.title)}</b><small>${esc(x.time)} · ${esc(x.detail)}</small></div>`).join(''):'<div class="empty">這一天尚無行程</div>';$('selectedtitle').textContent=dateFmt(selected);$('fullevents').innerHTML=events.length?events.map(x=>`<div class="task"><div class="details"><b>${esc(x.time)}　${esc(x.title)}</b><small>${esc(x.detail)}</small></div><button class="btn secondary" onclick="openForm('event',${x.id})">編輯</button><button class="remove" onclick="removeItem('events',${x.id})">×</button></div>`).join(''):'<p class="empty">尚無行程，點選新增行程開始規劃。</p>';$('monthtitle').textContent=month.toLocaleDateString('zh-TW',{year:'numeric',month:'long'});let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();$('monthgrid').innerHTML=['日','一','二','三','四','五','六'].map(w=>`<div class="muted" style="text-align:center">${w}</div>`).join('')+Array.from({length:first},()=>'<div></div>').join('')+Array.from({length:last},(_,i)=>{let s=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,count=data.events.filter(x=>x.date===s).length;return `<button class="day ${s===selected?'selected':''}" onclick="chooseDate('${s}')">${i+1}${count?`<small>● ${count}</small>`:''}</button>`}).join('')};function chooseDate(s){selected=s;month=new Date(s+'T12:00:00');render()}function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function taskHTML(x){return `<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${x.id})"><div class="details"><b>${esc(x.title)}</b> <span class="priority ${x.priority==='高優先'?'high':''}">${esc(x.priority)}</span><small>▦ ${esc(x.date)}</small></div><button class="remove" title="編輯" onclick="openForm('task',${x.id})">✎</button><button class="remove" title="刪除" onclick="removeItem('tasks',${x.id})">×</button></div>`}function renderTasks(){document.querySelectorAll('#tasktabs button').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));let filtered=data.tasks.filter(x=>filter==='all'||filter==='today'&&x.date===todayISO()||filter==='open'&&!x.done||filter==='done'&&x.done);$('hometasks').innerHTML=filtered.length?filtered.slice(0,6).map(taskHTML).join(''):'<p class="empty">沒有符合條件的任務</p>';let q=$('tasksearch').value.toLowerCase();$('alltasks').innerHTML=data.tasks.filter(x=>x.title.toLowerCase().includes(q)).map(taskHTML).join('')||'<p class="empty">尚無任務</p>'}function toggleTask(id){let x=data.tasks.find(x=>x.id===id);x.done=!x.done;persist();render()}
function noteHTML(x){return `<article class="note" onclick="openForm('note',${x.id})"><img src="${esc(x.image||'https://images.unsplash.com/photo-1456324504439-367cee3b3c32?w=450')}" alt=""><div class="inner"><strong>${esc(x.title)}</strong><p>${esc(x.body)}</p></div></article>`}function renderNotes(){$('homenotes').innerHTML=data.notes.slice(0,3).map(noteHTML).join('')||'<p class="empty">尚無筆記</p>';let q=$('notesearch').value.toLowerCase();$('allnotes').innerHTML=data.notes.filter(x=>(x.title+x.body).toLowerCase().includes(q)).map(noteHTML).join('')||'<p class="empty">尚無筆記</p>'}
function renderTrips(){let t=data.trips[0];$('hometrip').innerHTML=t?`<div class="triphero"><img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=500" alt="京都"><div><h3>${esc(t.title)}</h3><div class="muted">${esc(t.start)} — ${esc(t.end)}</div><p class="muted">${esc(t.detail)}</p><div class="progress"><i style="width:${Math.min(100,t.days.length*14)}%"></i></div></div></div>${t.days.slice(0,3).map(d=>`<div class="tripday"><strong>${esc(d.title)}</strong><p>✈ ${esc(d.detail)}</p></div>`).join('')}`:'<p class="empty">尚未建立旅程</p>';$('alltrips').innerHTML=data.trips.map(t=>`<div class="tripcard"><div class="panelhead"><div><h3>${esc(t.title)}</h3><div class="muted">${esc(t.start)} — ${esc(t.end)} · ${esc(t.detail)}</div></div><div><button class="btn secondary" onclick="openForm('trip',${t.id})">編輯</button> <button class="remove" onclick="removeItem('trips',${t.id})">×</button></div></div>${t.days.map((d,i)=>`<div class="tripday"><strong>${esc(d.title)}</strong><p>${esc(d.detail)}</p><button class="remove" onclick="deleteTripDay(${t.id},${i})">刪除此日</button></div>`).join('')}<button class="btn secondary" onclick="openForm('tripday',${t.id})">＋ 新增每日行程</button></div>`).join('')||'<p class="empty">尚未建立旅程</p>'}function deleteTripDay(id,i){if(!confirm('確定刪除這一天？'))return;data.trips.find(x=>x.id===id).days.splice(i,1);persist();render()}
const field=(label,name,value='',type='text')=>`<div class="formrow"><label>${label}</label>${type==='textarea'?`<textarea id="f-${name}">${esc(value)}</textarea>`:type==='select'?`<select id="f-${name}"><option ${value==='一般'?'selected':''}>一般</option><option ${value==='高優先'?'selected':''}>高優先</option><option ${value==='低優先'?'selected':''}>低優先</option></select>`:`<input id="f-${name}" type="${type}" value="${esc(value)}">`}</div>`;function openForm(type,id=null){formType=type;editId=id;let x=type==='tripday'?{}:(data[{task:'tasks',event:'events',note:'notes',trip:'trips'}[type]]||[]).find(v=>v.id===id)||{};let labels={task:'任務',event:'行程',note:'筆記',trip:'旅程',tripday:'每日行程'};$('formtitle').textContent=(id&&type!=='tripday'?'編輯':'新增')+labels[type];$('formfields').innerHTML=type==='task'?field('任務名稱','title',x.title)+field('日期','date',x.date||todayISO(),'date')+field('優先順序','priority',x.priority||'一般','select'):type==='event'?field('行程名稱','title',x.title)+field('日期','date',x.date||selected,'date')+field('時間','time',x.time||'09:00','time')+field('地點 / 備註','detail',x.detail):type==='note'?field('筆記標題','title',x.title)+field('內容','body',x.body,'textarea')+field('封面圖片網址（可留空）','image',x.image):type==='trip'?field('旅程名稱','title',x.title)+field('開始日期','start',x.start||todayISO(),'date')+field('結束日期','end',x.end||todayISO(),'date')+field('目的地 / 說明','detail',x.detail):field('日期標題（例如 Day 4 · 京都）','title')+field('行程內容','detail','','textarea');$('overlay').classList.add('show')}function closeForm(){$('overlay').classList.remove('show')}function saveForm(){let names={task:['title','date','priority'],event:['title','date','time','detail'],note:['title','body','image'],trip:['title','start','end','detail'],tripday:['title','detail']}[formType],obj={};names.forEach(n=>obj[n]=$('f-'+n).value.trim());if(!obj.title){alert('請填寫名稱');return}if(formType==='tripday'){data.trips.find(x=>x.id===editId).days.push(obj)}else{let arr=data[{task:'tasks',event:'events',note:'notes',trip:'trips'}[formType]];if(editId){Object.assign(arr.find(x=>x.id===editId),obj)}else{obj.id=Date.now();if(formType==='task')obj.done=false;if(formType==='trip')obj.days=[];arr.unshift(obj)}}persist();closeForm();render()}function removeItem(type,id){if(!confirm('確定要刪除嗎？'))return;data[type]=data[type].filter(x=>x.id!==id);persist();render()}$('overlay').onclick=e=>{if(e.target===$('overlay'))closeForm()};render();
render();
</script>
