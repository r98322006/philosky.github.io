                            {/* ROUTE FLOW CARDS */}
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="earth-card rounded-2xl p-5 flex items-center justify-between">
                                    <div class="space-y-1">
                                        <div class="text-xs font-bold text-earthTerracotta">10/21 – 10/24</div>
                                        <div class="text-base font-extrabold text-earthText">柬埔寨 暹粒 · Siem Reap</div>
                                        <div class="text-xs text-earthMuted">Angkor Wat / Sunrise / Tonle Sap / Coffee</div>
                                    </div>
                                    <i class="fa-solid fa-arrow-right text-earthMuted text-lg"></i>
                                </div>

                                <div class="earth-card rounded-2xl p-5 flex items-center justify-between">
                                    <div class="space-y-1">
                                        <div class="text-xs font-bold text-earthTerracotta">10/24 – 10/25 (10/26凌晨機)</div>
                                        <div class="text-base font-extrabold text-earthText">泰國 曼谷 · Bangkok</div>
                                        <div class="text-xs text-earthMuted">Grand Palace / SkyWalk / ICONSIAM / BR206</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SECTION MODULE 1: 時間軸行程 (TIMELINE) */}
                    {activeSection === 'timeline' && (
                        <div class="space-y-8">
                            {itinerary
                                .filter(day => activeTab === 'overview' || day.id === activeTab)
                                .map((day) => (
                                    <div key={day.id} class="space-y-4">
                                        {/* Day Header */}
                                        <div class="flex items-center justify-between pt-4 border-t border-earthBorder">
                                            <div>
                                                <div class="text-xs font-mono font-bold uppercase tracking-widest text-earthTerracotta">
                                                    DAY 0{day.dayNum} · {day.date.replace('/', ' OCT ')} ({day.dayOfWeek})
                                                </div>
                                                <h2 class="text-2xl md:text-3xl font-extrabold text-earthText mt-1">{day.title}</h2>
                                            </div>
                                            <span class="text-xs font-bold px-3 py-1.5 rounded-full border border-earthBorder text-earthOlive bg-earthCardAlt">
                                                {day.country} · {day.city}
                                            </span>
                                        </div>

                                        {/* Activity List */}
                                        <div class="space-y-4 pt-1">
                                            {day.activities.map((act) => (
                                                <div
                                                    key={act.id}
                                                    class={`earth-card rounded-2xl p-5 md:p-6 space-y-3 transition-all ${
                                                        act.completed ? 'opacity-60 bg-earthCardAlt/40' : 'opacity-100'
                                                    }`}
                                                >
                                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                                        <div class="flex items-center gap-2">
                                                            <button
                                                                onClick={() => toggleActivityStatus(day.id, act.id)}
                                                                class={`w-5 h-5 rounded-md border flex items-center justify-center transition-all ${
                                                                    act.completed
                                                                        ? 'bg-earthTerracotta border-earthTerracotta text-white'
                                                                        : 'border-earthMuted hover:border-earthTerracotta bg-white'
                                                                }`}
                                                            >
                                                                {act.completed && <i class="fa-solid fa-check text-xs font-bold"></i>}
                                                            </button>
                                                            <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-earthCardAlt border border-earthBorder text-earthText">
                                                                {act.time}
                                                            </span>
                                                            {act.badge && (
                                                                <span class="text-[11px] font-semibold px-2.5 py-1 rounded-lg border border-earthBorder text-earthTerracotta bg-earthWarmBadge">
                                                                    {act.badge}
                                                                </span>
                                                            )}
                                                        </div>

                                                        <a
                                                            href={act.mapUrl}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            class="text-xs font-semibold text-earthTerracotta hover:underline flex items-center gap-1.5 transition-colors"
                                                        >
                                                            <i class="fa-solid fa-location-dot"></i> 地圖導航
                                                        </a>
                                                    </div>

                                                    <h3 class={`text-lg font-bold text-earthText ${act.completed ? 'line-through' : ''}`}>
                                                        {act.title}
                                                    </h3>

                                                    <p class="text-sm text-earthMuted leading-relaxed">
                                                        {act.desc}
                                                    </p>

                                                    {act.tips && (
                                                        <div class="text-xs text-earthMuted bg-earthCardAlt/70 border border-earthBorder p-3 rounded-xl flex items-start gap-2">
                                                            <i class="fa-solid fa-circle-info text-earthTerracotta mt-0.5 shrink-0"></i>
                                                            <div><strong class="text-earthText">憑證/提醒：</strong>{act.tips}</div>
                                                        </div>
                                                    )}

                                                    <div class="pt-2 border-t border-earthBorder/60 flex items-center gap-2">
                                                        <i class="fa-regular fa-note-sticky text-earthMuted text-xs"></i>
                                                        <input
                                                            type="text"
                                                            placeholder="點擊新增個人打卡筆記..."
                                                            value={userNotes[act.id] || ''}
                                                            onChange={(e) => handleSaveNote(act.id, e.target.value)}
                                                            class="w-full bg-transparent text-xs text-earthText placeholder-earthMuted/60 outline-none"
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                        </div>
                    )}

                    {/* SECTION MODULE 2: 航班與住宿 (FLIGHTS & ACCOMMODATION) */}
                    {activeSection === 'flightHotel' && (
                        <div class="space-y-8">
                            
                            {/* Live Flight Monitor Header & Refresh button */}
                            <div class="space-y-4">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-earthBorder pb-3">
                                    <div>
                                        <h2 class="text-2xl font-extrabold text-earthText flex items-center gap-2.5">
                                            <i class="fa-solid fa-plane-departure text-earthTerracotta"></i> 航班即時監測 (Live Flight Status)
                                        </h2>
                                        <p class="text-xs text-earthMuted mt-1">
                                            系統連線更新時間：<span class="font-semibold text-earthText">{lastFlightUpdate}</span>
                                        </p>
                                    </div>
                                    <button
                                        onClick={handleRefreshFlights}
                                        disabled={isFlightRefreshing}
                                        class="px-4 py-2 rounded-xl bg-earthTerracotta text-white font-bold text-xs flex items-center gap-2 hover:bg-earthTerracottaDark transition-all disabled:opacity-50 shadow-sm"
                                    >
                                        <i class={`fa-solid fa-arrows-rotate ${isFlightRefreshing ? 'fa-spin' : ''}`}></i>
                                        <span>{isFlightRefreshing ? '同步數據中...' : '刷新即時動態'}</span>
                                    </button>
                                </div>

                                {/* Flight Cards Grid */}
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                                    {flights.map((f) => (
                                        <div key={f.id} class="earth-card rounded-3xl p-6 space-y-4 relative overflow-hidden flex flex-col justify-between">
                                            <div class="space-y-4">
                                                {/* Flight Status Header */}
                                                <div class="flex justify-between items-start border-b border-earthBorder pb-3">
                                                    <div>
                                                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-earthCardAlt border border-earthBorder text-earthOlive">
                                                            {f.type}
                                                        </span>
                                                        <h3 class="text-3xl font-black text-earthText mt-2 tracking-tight">{f.code}</h3>
                                                        <p class="text-xs font-semibold text-earthMuted mt-0.5">{f.airline}</p>
                                                    </div>
                                                    <div class="text-right">
                                                        <span class={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold border ${f.statusBadge}`}>
                                                            <span class="w-2 h-2 rounded-full bg-current pulse-live"></span>
                                                            {f.status}
                                                        </span>
                                                        <p class="text-xs font-bold text-earthMuted mt-2">{f.date}</p>
                                                    </div>
                                                </div>

                                                {/* Route Display */}
                                                <div class="bg-earthCardAlt/80 rounded-2xl p-4 border border-earthBorder space-y-3">
                                                    <div class="text-sm font-extrabold text-earthText flex items-center justify-between">
                                                        <span>{f.route.split('➔')[0]}</span>
                                                        <i class="fa-solid fa-plane text-earthTerracotta text-xs"></i>
                                                        <span>{f.route.split('➔')[1]}</span>
                                                    </div>

                                                    <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-earthBorder/60">
                                                        <div>
                                                            <div class="text-earthMuted text-[10px]">起飛時間 (Scheduled)</div>
                                                            <div class="text-earthText font-extrabold text-base">{f.scheduledDep}</div>
                                                        </div>
                                                        <div class="text-right">
                                                            <div class="text-earthMuted text-[10px]">降落時間 (Estimated)</div>
                                                            <div class="text-earthText font-extrabold text-base">{f.scheduledArr}</div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Real-time Gate & Terminal Details */}
                                                <div class="grid grid-cols-2 sm:grid-cols-2 gap-2 text-center text-xs">
                                                    <div class="p-2.5 rounded-xl bg-earthCardAlt/40 border border-earthBorder">
                                                        <div class="text-[10px] text-earthMuted">出發航廈</div>
                                                        <div class="font-bold text-earthText mt-0.5">{f.depTerminal}</div>
                                                    </div>
                                                    <div class="p-2.5 rounded-xl bg-earthCardAlt/40 border border-earthBorder">
                                                        <div class="text-[10px] text-earthMuted">登機門 Gate</div>
                                                        <div class="font-extrabold text-earthTerracotta text-sm mt-0.5">{f.depGate}</div>
                                                    </div>
                                                    <div class="p-2.5 rounded-xl bg-earthCardAlt/40 border border-earthBorder">
                                                        <div class="text-[10px] text-earthMuted">報到櫃檯</div>
                                                        <div class="font-bold text-earthText mt-0.5">{f.checkInCounter}</div>
                                                    </div>
                                                    <div class="p-2.5 rounded-xl bg-earthCardAlt/40 border border-earthBorder">
                                                        <div class="text-[10px] text-earthMuted">行李輪盤</div>
                                                        <div class="font-bold text-earthOlive text-sm mt-0.5">{f.baggageBelt}</div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="text-xs text-earthMuted leading-relaxed pt-3 border-t border-earthBorder/60">
                                                <strong class="text-earthText">搭機貼士：</strong> {f.note}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* HOTELS SECTION */}
                            <div class="space-y-4 pt-4 border-t border-earthBorder">
                                <h2 class="text-2xl font-extrabold text-earthText flex items-center gap-2">
                                    <i class="fa-solid fa-hotel text-earthOlive"></i> 住宿指南 (Hotels)
                                </h2>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    {hotelsData.map((h, idx) => (
                                        <div key={idx} class="earth-card rounded-3xl p-6 space-y-4">
                                            <div class="flex justify-between items-start">
                                                <div>
                                                    <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-earthWarmBadge border border-earthBorder text-earthTerracotta">
                                                        {h.badge}
                                                    </span>
                                                    <h3 class="text-xl font-extrabold text-earthText mt-2">{h.name}</h3>
                                                    <p class="text-xs font-semibold text-earthMuted mt-1">{h.city}</p>
                                                </div>
                                                <span class="text-xs font-bold text-earthText bg-earthCardAlt px-3 py-1.5 rounded-xl border border-earthBorder">
                                                    {h.rating}
                                                </span>
                                            </div>

                                            <div class="space-y-1.5 text-xs text-earthMuted border-t border-earthBorder pt-3">
                                                <p><strong class="text-earthText">預訂日期:</strong> {h.dates}</p>
                                                <p><strong class="text-earthText">飯店地址:</strong> {h.address}</p>
                                            </div>

                                            <a
                                                href={h.mapUrl}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                class="w-full py-3 rounded-2xl bg-earthCardAlt hover:bg-earthSand/50 border border-earthBorder text-earthText font-bold text-xs flex items-center justify-center gap-2 transition-colors"
                                            >
                                                <i class="fa-solid fa-map-pin text-earthTerracotta"></i> Google Maps 地圖查看與導航
                                            </a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SECTION MODULE 3: 精選咖啡館與餐廳 (CAFES & RESTAURANTS) */}
                    {activeSection === 'cafes' && (
                        <div class="earth-card rounded-3xl p-6 md:p-8 space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-earthBorder pb-4">
                                <div>
                                    <h2 class="text-2xl font-extrabold text-earthText flex items-center gap-2">
                                        <i class="fa-solid fa-mug-saucer text-earthTerracotta"></i> 暹粒精選咖啡館與餐廳名單 ({cafeList.length} 間)
                                    </h2>
                                    <p class="text-xs text-earthMuted mt-1">為您挑選的風格咖啡館、烘焙名店與特色餐廳，已整合至每日行程空檔！</p>
                                </div>
                                <span class="text-xs font-bold px-3 py-1.5 rounded-full bg-earthWarmBadge border border-earthBorder text-earthTerracotta">
                                    點擊可一鍵開啟地圖
                                </span>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                {cafeList.map((cafe, i) => (
                                    <div key={i} class="p-4 rounded-2xl bg-earthCardAlt/60 border border-earthBorder space-y-3 flex flex-col justify-between hover:border-earthTerracotta transition-all">
                                        <div class="space-y-2">
                                            <div class="flex justify-between items-start gap-2">
                                                <h3 class="font-extrabold text-earthText text-sm leading-snug">{cafe.name}</h3>
                                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-white text-earthMuted shrink-0 border border-earthBorder">
                                                    {cafe.area}
                                                </span>
                                            </div>
                                            <div class="flex flex-wrap gap-1">
                                                {cafe.tags.map((tag, tidx) => (
                                                    <span key={tidx} class="text-[10px] text-earthTerracotta bg-earthWarmBadge px-2 py-0.5 rounded font-medium">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>

                                        <a
                                            href={cafe.map}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            class="w-full py-2 rounded-xl bg-white hover:bg-earthTerracotta hover:text-white border border-earthBorder text-earthText font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm"
                                        >
                                            <i class="fa-solid fa-location-dot"></i> Google Maps 地圖查看
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* SECTION MODULE 4: 預算與記帳 (BUDGET & EXPENSES) */}
                    {activeSection === 'budget' && (
                        <div class="earth-card rounded-3xl p-6 md:p-8 space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-earthBorder pb-4">
                                <div>
                                    <h2 class="text-2xl font-extrabold text-earthText flex items-center gap-2">
                                        <i class="fa-solid fa-wallet text-earthTerracotta"></i> 雙國旅費記帳 (Budget Tracker)
                                    </h2>
                                    <p class="text-xs text-earthMuted mt-1">即時紀錄美元 (USD) 與泰銖 (THB) 支出</p>
                                </div>
                                <div class="flex gap-2 text-xs">
                                    <div class="bg-earthCardAlt px-3.5 py-2 rounded-2xl border border-earthBorder">
                                        <span class="text-earthMuted font-medium">USD 美金總計:</span> <strong class="text-earthTerracotta font-extrabold ml-1">${usdTotal.toLocaleString()}</strong>
                                    </div>
                                    <div class="bg-earthCardAlt px-3.5 py-2 rounded-2xl border border-earthBorder">
                                        <span class="text-earthMuted font-medium">THB 泰銖總計:</span> <strong class="text-earthOlive font-extrabold ml-1">฿{thbTotal.toLocaleString()}</strong>
                                    </div>
                                </div>
                            </div>

                            {/* ADD EXPENSE FORM */}
                            <form onSubmit={handleAddExpense} class="bg-earthCardAlt/60 p-4 rounded-2xl border border-earthBorder grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                                <input
                                    type="text"
                                    placeholder="品項說明 (如: The Little Red Fox 手沖)"
                                    value={newExpTitle}
                                    onChange={(e) => setNewExpTitle(e.target.value)}
                                    class="bg-white border border-earthBorder rounded-xl px-3 py-2 text-xs text-earthText outline-none focus:border-earthTerracotta"
                                />
                                <input
                                    type="number"
                                    placeholder="金額"
                                    value={newExpAmount}
                                    onChange={(e) => setNewExpAmount(e.target.value)}
                                    class="bg-white border border-earthBorder rounded-xl px-3 py-2 text-xs text-earthText outline-none focus:border-earthTerracotta"
                                />
                                <select
                                    value={newExpCurrency}
                                    onChange={(e) => setNewExpCurrency(e.target.value)}
                                    class="bg-white border border-earthBorder rounded-xl px-3 py-2 text-xs text-earthText outline-none"
                                >
                                    <option value="USD">USD ($ 美金)</option>
                                    <option value="THB">THB (฿ 泰銖)</option>
                                </select>
                                <select
                                    value={newExpCategory}
                                    onChange={(e) => setNewExpCategory(e.target.value)}
                                    class="bg-white border border-earthBorder rounded-xl px-3 py-2 text-xs text-earthText outline-none"
                                >
                                    <option value="餐飲">餐飲美食</option>
                                    <option value="門票">門票導覽</option>
                                    <option value="交通">交通工具</option>
                                    <option value="SPA">SPA水療</option>
                                    <option value="娛樂">酒吧夜生活</option>
                                </select>
                                <button
                                    type="submit"
                                    class="bg-earthTerracotta text-white font-bold rounded-xl text-xs py-2 transition-all hover:bg-earthTerracottaDark flex items-center justify-center gap-1 shadow-sm"
                                >
                                    <i class="fa-solid fa-plus"></i> 新增開銷
                                </button>
                            </form>

                            {/* EXPENSE LIST */}
                            <div class="space-y-2">
                                <h3 class="text-xs font-bold text-earthMuted uppercase tracking-wider">已紀錄開銷明細</h3>
                                <div class="divide-y divide-earthBorder">
                                    {expenses.map((exp) => (
                                        <div key={exp.id} class="py-3 flex items-center justify-between text-xs">
                                            <div class="flex items-center gap-3">
                                                <span class="px-2.5 py-0.5 rounded-lg bg-earthWarmBadge text-earthTerracotta font-bold border border-earthBorder">
                                                    {exp.category}
                                                </span>
                                                <span class="font-bold text-earthText">{exp.title}</span>
                                            </div>
                                            <div class="flex items-center gap-4">
                                                <span class="font-extrabold text-earthText">
                                                    {exp.currency === 'USD' ? '$' : '฿'}{exp.amount.toLocaleString()}
                                                </span>
                                                <button
                                                    onClick={() => handleDeleteExpense(exp.id)}
                                                    class="text-earthMuted hover:text-rose-600 transition-colors"
                                                >
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SECTION MODULE 5: 行前準備清單 (CHECKLIST) */}
                    {activeSection === 'checklist' && (
                        <div class="earth-card rounded-3xl p-6 md:p-8 space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-earthBorder pb-4">
                                <div>
                                    <h2 class="text-2xl font-extrabold text-earthText flex items-center gap-2">
                                        <i class="fa-solid fa-square-check text-earthOlive"></i> 行前準備與行李清單
                                    </h2>
                                    <p class="text-xs text-earthMuted mt-1">出發前勾選確認雙國必備物品與團體憑證</p>
                                </div>
                                <div class="text-xs font-mono font-bold text-earthTerracotta bg-earthWarmBadge px-3 py-1.5 rounded-full border border-earthBorder">
                                    {checklist.filter(c => c.checked).length} / {checklist.length} COMPLETED
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {checklist.map((item) => (
                                    <div
                                        key={item.id}
                                        onClick={() => toggleChecklistItem(item.id)}
                                        class={`p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${
                                            item.checked
                                                ? 'bg-earthCardAlt/40 border-earthBorder text-earthMuted'
                                                : 'bg-white border-earthBorder text-earthText hover:border-earthTerracotta shadow-sm'
                                        }`}
                                    >
                                        <div class="flex items-center gap-3">
                                            <div class={`w-4 h-4 rounded border flex items-center justify-center transition-all ${
                                                item.checked ? 'bg-earthTerracotta border-earthTerracotta text-white' : 'border-earthMuted bg-white'
                                            }`}>
                                                {item.checked && <i class="fa-solid fa-check text-[10px] font-bold"></i>}
                                            </div>
                                            <span class={`text-xs md:text-sm font-medium ${item.checked ? 'line-through' : ''}`}>
                                                {item.text}
                                            </span>
                                        </div>
                                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-earthCardAlt text-earthMuted">
                                            {item.category}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer class="text-center py-8 border-t border-earthBorder text-xs text-earthMuted space-y-1">
                        <p class="font-bold text-earthText">Angkor × Bangkok Dual-City Itinerary</p>
                        <p class="text-[11px] text-earthMuted">大地暖色系風格 ✕ Klook 憑證整合 ✕ 咖啡地圖與長榮 BR206 返航</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
